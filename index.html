 g.dataset.id=n.id;
 g.appendChild(el("rect",{width:W,height:H}));
 g.appendChild(el("rect",{width:5,height:H,rx:2,fill:COR[n.tipo],class:"cor"}));
 lines.forEach((L,i)=>{const t=el("text",{x:13,y:(lines.length>1?16:18)+i*14});
  t.textContent=(n.tipo==="fragilidade"&&i===0?"⚠ ":"")+L;g.appendChild(t);});
 if(n.sub&&!hub){const t=el("text",{x:13,y:H-8,class:"s"});t.textContent=String(n.sub).slice(0,30);g.appendChild(t);}
 g.addEventListener("pointerdown",ev=>ev.stopPropagation());
 g.addEventListener("click",ev=>{
   ev.stopPropagation();
   sel(n.id);
   if(n.document_url) window.open(n.document_url,"_blank","noopener");
 });
 gn.appendChild(g);});
// câmera
let vx=0,vy=0,z=.62;
function apply(){cam.setAttribute("transform",`translate(${vx},${vy}) scale(${z})`);}
function fit(){const s=document.getElementById("stage").getBoundingClientRect();
 let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
 D.nos.forEach(n=>{mnx=Math.min(mnx,n.x-100);mxx=Math.max(mxx,n.x+100);mny=Math.min(mny,n.y-34);mxy=Math.max(mxy,n.y+34);});
 z=Math.min(s.width/(mxx-mnx),s.height/(mxy-mny))*.92;
 vx=s.width/2-((mnx+mxx)/2)*z; vy=s.height/2-((mny+mxy)/2)*z; apply();}
const st=document.getElementById("stage");
let dg=false,px,py;
st.addEventListener("pointerdown",e=>{dg=true;px=e.clientX;py=e.clientY;st.classList.add("drag");st.setPointerCapture(e.pointerId);});
st.addEventListener("pointermove",e=>{if(!dg)return;vx+=e.clientX-px;vy+=e.clientY-py;px=e.clientX;py=e.clientY;apply();});
st.addEventListener("pointerup",e=>{dg=false;st.classList.remove("drag");});
st.addEventListener("wheel",e=>{e.preventDefault();const r=st.getBoundingClientRect();
 const mx=e.clientX-r.left,my=e.clientY-r.top,f=e.deltaY<0?1.12:1/1.12,nz=Math.max(.18,Math.min(2.6,z*f));
 vx=mx-(mx-vx)*(nz/z);vy=my-(my-vy)*(nz/z);z=nz;apply();},{passive:false});
document.getElementById("zi").onclick=()=>{z=Math.min(2.6,z*1.22);apply();};
document.getElementById("zo").onclick=()=>{z=Math.max(.18,z/1.22);apply();};
document.getElementById("fit").onclick=fit;
document.getElementById("tema").onclick=()=>{const h=document.documentElement;
 h.dataset.theme=h.dataset.theme==="dark"?"light":"dark";};
st.addEventListener("click",()=>{if(!dg)limpa();});
// seleção
function limpa(){document.querySelectorAll("g.node").forEach(g=>g.classList.remove("off","on"));
 document.querySelectorAll(".edge").forEach(e=>e.classList.remove("off","on"));ajuda();}
function sel(id){
 const n=byId[id];if(!n)return;
 const rede=new Set([id]); const ar=new Set();
 (viz[id]||[]).forEach(i=>{const e=D.arestas[i];ar.add(i);rede.add(e.a===id?e.b:e.a);});
 document.querySelectorAll("g.node").forEach(g=>{
  g.classList.toggle("on",g.dataset.id===id);
  g.classList.toggle("off",!rede.has(g.dataset.id));});
 document.querySelectorAll(".edge").forEach(e=>{const i=+e.dataset.i;
  e.classList.toggle("on",ar.has(i)); e.classList.toggle("off",!ar.has(i));});
 painel(n);
}
function painel(n){
 const nomes={estrutura:"Estrutura",prova:"Prova",questao:"Questão jurídica",fragilidade:"Fragilidade",parcela:"Parcela"};
 let bd="";
 if(n.classe==="forte")bd=`<span class="badge b-forte">SUPORTE DOCUMENTAL FORTE</span>`;
 else if(n.classe==="moderado")bd=`<span class="badge b-moderado">SUPORTE DOCUMENTAL MODERADO</span>`;
 else if(n.classe)bd=`<span class="badge b-${esc(n.classe)}">${esc(n.classe)}</span>`;
 let h=`<div class="aviso">${esc(nomes[n.tipo])}${n.tipo==="fragilidade"?" ⚠":""}</div><h3>${esc(n.rot)}${bd}</h3>`;
 if(n.sub)h+=`<div class="as">${esc(n.sub)}</div>`;
 if(n.oq)h+=`<div class="fld"><b>${n.tipo==="questao"?"Contexto":"O que é"}</b><p>${esc(n.oq)}</p></div>`;
 if(n.sit)h+=`<div class="fld"><b>${n.tipo==="questao"?"Pergunta submetida":"Situação"}</b><p>${esc(n.sit)}</p></div>`;
 if(n.impacto)h+=`<div class="fld"><b>Impacto</b><p>${esc(n.impacto)}</p></div>`;
 if(n.periodo)h+=`<div class="fld"><b>Período</b><p>${esc(n.periodo)}</p></div>`;
 if(n.destinatario)h+=`<div class="fld"><b>Destinatário</b><p>${esc(n.destinatario)}</p></div>`;
 if(n.limitacao)h+=`<div class="fld"><b>Limitação relevante</b><p>${esc(n.limitacao)}</p></div>`;
 if(n.evs&&n.evs.length)h+=`<div class="fld"><b>Evidências</b><div class="chips">${n.evs.map(e=>`<button class="chip" data-b="${esc(e)}">${esc(e)}</button>`).join("")}</div></div>`;
 if(n.q&&n.q.length)h+=`<div class="fld"><b>Questões relacionadas</b><div class="chips">${n.q.map(q=>`<button class="chip q" data-go="q:${esc(q)}">Questão ${esc(q)}</button>`).join("")}</div></div>`;
 if(n.relaciona&&n.relaciona.length)h+=`<div class="fld"><b>Afeta</b><div class="chips">${n.relaciona.map(r=>byId[r]?`<button class="chip" data-go="${esc(r)}">${esc(byId[r].rot)}</button>`:"").join("")}</div></div>`;
 h+= n.document_url?`<a class="abrir" href="${esc(n.document_url)}" target="_blank" rel="noopener">${/\/drive\/folders\//.test(n.document_url)?"ABRIR NO DRIVE":"ABRIR DOCUMENTO"}</a>`
   :`<div class="fld"><b>Acervo</b><p class="semdoc">Documento ainda não vinculado ao acervo.</p></div>`;
 const p=document.getElementById("painel");p.innerHTML=h;
 p.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{sel(b.dataset.go);centra(b.dataset.go);});
 p.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{document.getElementById("busca").value=b.dataset.b;filtra();});
}
function centra(id){const n=byId[id];if(!n)return;const s=st.getBoundingClientRect();
 vx=s.width/2-n.x*z; vy=s.height/2-n.y*z; apply();}
function filtra(){
 const q=document.getElementById("busca").value.trim().toLowerCase();
 document.querySelectorAll("g.node").forEach(g=>{
  const n=byId[g.dataset.id];if(!n)return;
  if(!q){g.classList.remove("hit","off");return;}
  const alvo=[n.rot,n.sub,n.oq,n.sit,n.impacto,(n.evs||[]).join(" "),(n.q||[]).join(" ")].join(" ").toLowerCase();
  const bate=alvo.includes(q); g.classList.toggle("hit",bate); g.classList.toggle("off",!bate);});
 if(!q)document.querySelectorAll(".edge").forEach(e=>e.classList.remove("off"));
 else document.querySelectorAll(".edge").forEach(e=>e.classList.add("off"));
}
document.getElementById("busca").addEventListener("input",filtra);
function ajuda(){document.getElementById("painel").innerHTML=`<div class="aviso">${esc(D.classificacao)}</div>
<h3>Mapa de conexões</h3><div class="as">Índice visual do dossiê</div>
<div class="fld"><b>O documento explica · o mapa conecta · o acervo comprova</b>
<p>Arraste para mover, use a roda para dar zoom e <b>clique em qualquer nó</b> para abrir o documento correspondente no Drive em uma nova aba. O painel lateral também mostra os detalhes do nó.</p></div>
<div class="fld"><b>Linhas</b><p>Contínua liga estrutura. Tracejada liga evidência ao que ela sustenta. Pontilhada liga a questão jurídica ao que ela afeta.</p></div>
<div class="fld"><b>Busca</b><p>Digite <kbd>EV-076</kbd>, <kbd>Questão N</kbd> ou um termo como <kbd>anexo</kbd>.</p></div>
<div class="fld"><b>Cor não é a informação</b><p>Cada nó traz o tipo escrito aqui no painel, e as fragilidades levam ⚠ no rótulo.</p></div>
<div class="fld"><b>O que este mapa não faz</b><p>Não conclui exigibilidade, não calcula encargos, não escolhe via processual e não responde nenhuma das questões A–N.</p></div>`;}
fit();ajuda();requestAnimationFrame(fit);window.addEventListener("resize",fit);
</script></body></html>
